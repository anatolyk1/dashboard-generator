<!doctype html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ BRAND_NAME }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232a63e0'/%3E%3Crect x='5' y='12' width='3' height='7' rx='1' fill='white'/%3E%3Crect x='10.5' y='8' width='3' height='11' rx='1' fill='white' opacity='.8'/%3E%3Crect x='16' y='5' width='3' height='14' rx='1' fill='white' opacity='.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="12" width="4" height="9" rx="1" fill="currentColor"/>
            <rect x="10" y="7" width="4" height="14" rx="1" fill="currentColor" opacity="0.75"/>
            <rect x="17" y="3" width="4" height="18" rx="1" fill="currentColor" opacity="0.5"/>
          </svg>
        </span>
        {{ BRAND_NAME }}
      </span>
      {% block header_action %}{% endblock %}
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <p>{{ BRAND_NAME }} &middot; arquivos processados em memória e não armazenados &middot; <a href="/privacidade">Privacidade</a></p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
